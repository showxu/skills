name: Profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [{{default-branch}}]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&border_radius=8&border_color=d0d7de&title_color={{accent-text}}&icon_color={{accent}}&ring_color={{accent}}
          path: dist/stats.svg
          fail_on_error: true

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&border_radius=8&theme=github_dark&bg_color=0d1117&border_color=30363d&title_color={{accent-dark}}&icon_color={{accent-dark}}&ring_color={{accent-dark}}
          path: dist/stats-dark.svg
          fail_on_error: true

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&border_radius=8&border=d0d7de&ring={{accent}}&fire={{accent}}&currStreakLabel={{accent-text}}
          path: dist/streak.svg

      - name: Generate dark streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&border_radius=8&background=0d1117&border=30363d&stroke=30363d&ring={{accent-dark}}&fire={{accent-dark}}&currStreakLabel={{accent-dark}}&currStreakNum=e6edf3&sideNums=e6edf3&sideLabels=e6edf3&dates=9198a1
          path: dist/streak-dark.svg

      # Runs last: this Docker action writes as root, so earlier steps could not add to dirs it creates.
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#{{snake-light}}&color_dots={{dots-light}}
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#{{snake-dark}}&color_dots={{dots-dark}}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Update recent releases
        run: python3 .github/scripts/recent_releases.py README.md {{owner-flags}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update recent releases" -- README.md
          git push
