name: Skill collection validation

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  source-policy:
    uses: swift-library/github-workflows/.github/workflows/policy.yml@780ee5a8150d1088ac4256862bdadab632f89912
    with:
      allow-terms: |
        ChatGPT
        Codex
        Cursor
        Claude

  policy:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check collection publication content
        run: python3 -B scripts/check_policy.py

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OVERLAP_TEST_OUTPUT: ${{ github.workspace }}/.build/fork-dog-tests
      ORG_TEST_OUTPUT: ${{ github.workspace }}/.build/governance-tests
      REPO_STEWARD_TEST_OUTPUT: ${{ github.workspace }}/.build/repo-steward-tests
      REPOSITORY_TEST_OUTPUT: ${{ github.workspace }}/.build/repository-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check collection and publication surface
        run: python3 -B scripts/check_repository.py
      - name: Check framework icon palettes
        run: |
          python3 -B skills/apple-framework-icon-design/scripts/test_design_icons.py
          python3 -B skills/apple-framework-icon-design/scripts/design_icons.py skills/apple-framework-icon-design/examples/DESIGN.example.md --lint
          python3 -B skills/apple-framework-icon-design/scripts/design_icons.py skills/apple-framework-icon-design/examples/DESIGN.tiles.example.md --lint
      - name: Check app icon exports
        run: |
          mkdir -p .build/app-icon-tests
          TMPDIR="$PWD/.build/app-icon-tests" python3 -B skills/apple-app-icon-design/scripts/test_app_icons.py
      - name: Exercise design resource archive
        run: python3 -B skills/apple-design-resource/scripts/test_fetch_apple_design_resources.py
      - name: Check documentation adapters
        run: python3 -B skills/repository-docs/scripts/derive_rules.py skills/pyproject-docs --check
      - name: Exercise repository policy
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Exercise clean-room overlap audit
        run: python3 -B -m unittest discover -s skills/fork-dog/tests -v
      - name: Exercise repository stewardship
        run: |
          python3 -m venv .build/repo-audit-venv
          .build/repo-audit-venv/bin/python -m pip install --disable-pip-version-check -r skills/github-repo-steward/scripts/requirements.txt
          .build/repo-audit-venv/bin/python -B -m unittest discover -s skills/github-repo-steward/tests -v
      - name: Exercise organization governance
        run: python3 -B -m unittest discover -s skills/github-org-steward/tests -v

  presentation-toolchain:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/github-readme-design/scripts/.node-version
          package-manager-cache: false
      - name: Check presentation toolchain and goldens
        working-directory: skills/github-readme-design/scripts
        run: npm ci --ignore-scripts && npm test

  result:
    needs: [policy, validate, presentation-toolchain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          POLICY: ${{ needs.policy.result }}
          VALIDATE: ${{ needs.validate.result }}
          PRESENTATION: ${{ needs.presentation-toolchain.result }}
        run: |
          test "$POLICY" = success
          test "$VALIDATE" = success
          test "$PRESENTATION" = success
